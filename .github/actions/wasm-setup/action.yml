name: Setup wasm
description: Build the wasm of the sandbox machines written in Rust (pnpm build:wasm) for jobs that import them. Runs after ci-setup.

runs:
  using: composite
  steps:
    - name: setup rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        # Every job that uses this action builds the same wasm: share one cache.
        shared-key: wasm

    - name: read wasm-bindgen version
      id: wasm-bindgen
      shell: bash
      # The CLI must match the wasm-bindgen crate exactly. Read the version from
      # Cargo.lock instead of pinning it a second time here.
      run: |
        version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: setup wasm-bindgen
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

    # wasm-opt (binaryen) isn't installed, so the script skips its size pass: the
    # binary is bigger but behaves the same.
    - name: build wasm
      shell: bash
      run: pnpm build:wasm
