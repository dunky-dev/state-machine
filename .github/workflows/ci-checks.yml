name: CI checks

# The full CI suite as parallel jobs. Runs directly on every PR, and is also
# reused by release.yml as a gate before releasing (workflow_call).
on:
  pull_request:
    branches: ['**']
  workflow_call:

# Fork PRs run without secrets; these checks don't need any.
permissions:
  contents: read

# One run per PR (or per ref): a new push cancels the in-progress run for the
# same PR so force-pushes don't pile up. github.ref is unique per PR
# (refs/pull/<n>/merge), so PRs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      # @dunky.dev/state-machine ships the engine's wasm (packages/core/wasm).
      - uses: ./.github/actions/wasm-setup
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      # The engine (packages/core/wasm) and the Rust machines of the sandbox tests.
      - uses: ./.github/actions/wasm-setup
      - run: pnpm test:ci

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      # The core package and the Rust-machine loaders import the generated bindings.
      - uses: ./.github/actions/wasm-setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - run: pnpm lint

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - run: pnpm format:check

  rust:
    # The Cargo workspace needs no Node, so no ci-setup.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/uniffi -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Again in release: overflow checks and debug assertions are off there, as
      # in the shipped wasm.
      - run: cargo test --workspace --release
      # crates/uniffi (React Native over JSI) sits outside the workspace with its own
      # lockfile; its checks run on the host and need no mobile toolchain.
      - run: cargo fmt --manifest-path crates/uniffi/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/uniffi/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/uniffi/Cargo.toml

  versioning:
    # The release PR consumes changesets rather than adding one — never flag it.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changeset can diff against the base branch.
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - run: pnpm changeset status --since=origin/main
