[package]
name = "dunky-core-wasm"
description = "The wasm that @dunky.dev/state-machine ships: the Rust engine plus the runtime for TS-authored machines."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dunky-wasm = { workspace = true, features = ["runtime"] }
wasm-bindgen = { workspace = true }
