[package]
name = "dunky-core"
description = "Substrate-agnostic state-machine engine — the Rust port of @dunky.dev/state-machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["derive", "serde"]
# #[derive(State, Event, Context)]
derive = ["dep:dunky-macros"]
# Per-field serialization (SerializeFields) for bindings that mirror context into JS.
serde = ["dep:serde"]

[dependencies]
dunky-macros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
