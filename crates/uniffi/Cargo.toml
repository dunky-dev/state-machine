# React Native binding of the engine, built by uniffi-bindgen-react-native.
# Standalone on purpose: its own (empty) workspace, so its mobile-only toolchain can
# never break the other crates' builds, and so it builds from a git worktree too (cargo
# would otherwise walk up to the main checkout's workspace).
[workspace]

[package]
name = "dunky-state-machine-uniffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dunky-dev/state-machine"
publish = false

[lib]
name = "dunky_state_machine_uniffi"
# staticlib: what ubrn links into the iOS xcframework and the Android turbo-module.
# cdylib: what ubrn's `jsi2` flavour loads instead, keeping that path open.
crate-type = ["cdylib", "staticlib"]

[dependencies]
dunky-state-machine = { path = "../core" }
dunky-sandbox = { path = "../sandbox" }
serde_json = "1"
# Must stay on the uniffi minor that uniffi-bindgen-react-native is built with
# (ubrn 0.31.0-6 -> uniffi 0.31): the generated C++/TS check the contract version.
uniffi = "=0.31"
