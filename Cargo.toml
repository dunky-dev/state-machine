# The Rust engine: its own implementation of packages/core/SPEC.md, next to the TS one,
# and its JS binding (crates/wasm).
# Members are listed explicitly so a half-built crate never breaks
# `cargo test --workspace` for the others.
[workspace]
resolver = "3"
members = ["crates/core", "crates/core/macros", "crates/wasm", "sandbox/rust", "benchmark/rust"]
# The React Native bridge: built by its own pipeline (uniffi-bindgen-react-native today).
exclude = ["crates/jsi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dunky-dev/state-machine"
rust-version = "1.85"

[workspace.dependencies]
dunky-state-machine = { path = "crates/core" }
dunky-state-machine-macros = { path = "crates/core/macros" }
dunky-state-machine-wasm = { path = "crates/wasm" }
dunky-sandbox = { path = "sandbox/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the installed wasm-bindgen CLI exactly (wasm-bindgen --version).
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.release]
# Function names in profiles of the benchmark (no effect on speed).
debug = "line-tables-only"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Size-tuned profile for the shipped .wasm.
[profile.wasm]
inherits = "release"
opt-level = "z"
strip = true
