# The Rust engine: its own implementation of packages/core/SPEC.md, next to the TS one.
# Members are listed explicitly so a half-built crate never breaks
# `cargo test --workspace` for the others.
[workspace]
resolver = "3"
members = ["crates/core", "crates/macros", "crates/sandbox"]
# Built by its own pipeline (uniffi-bindgen-react-native) for iOS/Android.
exclude = ["crates/uniffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dunky-dev/state-machine"
rust-version = "1.85"

[workspace.dependencies]
dunky-core = { path = "crates/core" }
dunky-macros = { path = "crates/macros" }
dunky-sandbox = { path = "crates/sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
